name: daily-nyusatsu

on:
  schedule:
    - cron: "0 22 * * *" # 毎日 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest

      - name: Collect to CSV
        run: python main.py --csv data/bids.csv

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.csv
          git diff --cached --quiet || git commit -m "data: update bids $(TZ=Asia/Tokyo date +%F)"
          git push

      # Secrets を登録した場合のみ Google スプレッドシートにも追記する
      - name: Restore service account
        if: env.SPREADSHEET_ID != ''
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
      - name: Append to Google Sheets
        if: env.SPREADSHEET_ID != ''
        env:
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          SERVICE_ACCOUNT_JSON: service_account.json
        run: python main.py
